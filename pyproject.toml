[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deid-latam"
version = "0.1.0"
description = "Latin American national identifiers for PII detection pipelines, with check-digit validation and a public benchmark for Chilean clinical documents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["pii", "phi", "de-identification", "anonymization", "rut", "chile", "latam", "clinical-nlp", "presidio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: Spanish",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
presidio = ["presidio-analyzer>=2.2"]
openmed = ["openmed>=2.3"]

[project.urls]
Homepage = "https://github.com/pumanzor/deid-latam"
Issues = "https://github.com/pumanzor/deid-latam/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/deid_latam"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
